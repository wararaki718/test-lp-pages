<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample LPs</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      color: #333;
      background: #f7f7f7;
    }

    header {
      padding: 20px 40px;
      background: #333;
      color: white;
    }

    main {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 16px;
    }

    .description {
      margin-bottom: 40px;
      color: #666;
    }

    .links {
      display: grid;
      gap: 20px;
    }

    .card {
      display: block;
      padding: 24px;
      background: white;
      border-radius: 8px;
      color: #333;
      text-decoration: none;
      border: 1px solid #ddd;
    }

    .card:hover {
      background: #f0f0f0;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .card p {
      margin: 0;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <strong>Sample LPs</strong>
  </header>

  <main>
    <h1>サンプルLP</h1>

    <p class="description">
      GitHub Pagesで公開しているサンプルページです。
    </p>

    <div class="links">

      <a class="card" href="./lp01/">
        <h2>LP 01</h2>
        <p>サンプルLP 01を表示する</p>
      </a>

      <a class="card" href="./lp02/">
        <h2>LP 02</h2>
        <p>サンプルLP 02を表示する</p>
      </a>

    </div>
  </main>

</body>
</html>
