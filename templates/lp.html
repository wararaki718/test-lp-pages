<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
</head>

<body>

<header>
    <h1>{{ hero.title }}</h1>
    <p>{{ hero.text }}</p>
</header>

<main>

    <section>
        <h2>Features</h2>

        <ul>
        {% for feature in features %}
            <li>
                <h3>{{ feature.title }}</h3>
                <p>{{ feature.text }}</p>
            </li>
        {% endfor %}
        </ul>
    </section>

    <section>
        <a href="{{ cta.url }}">
            {{ cta.text }}
        </a>
    </section>

</main>

</body>
</html>
